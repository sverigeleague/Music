# Monthly (2nd of the month, after the month's last daily snapshot): registry and genre review list, stream totals,
# release dates of new songs (Deezer, then MusicBrainz, then a second Deezer pass for the songs still undated),
# Deezer fans, labels and label owners, YouTube, photos for new artists, Wikipedia page views.
# Each data step may fail or time out on its own without losing the others: the commit runs whatever happened.
# Can also be started by hand (Actions > monthly > Run workflow) on any branch; it commits to that branch.
name: monthly
on:
  schedule:
    - cron: "41 10 2 * *"
  workflow_dispatch:
    inputs:
      only:
        description: "run only these steps (space-separated, e.g. 'financials reports'); empty runs all"
        required: false
        default: ""
permissions:
  contents: write
concurrency:
  group: data
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m src.run registry
        if: ${{ !inputs.only || contains(format(' {0} ', inputs.only), ' registry ') }}
        continue-on-error: true
        timeout-minutes: 40
      - run: python -m src.run streams
        if: ${{ !inputs.only || contains(format(' {0} ', inputs.only), ' streams ') }}
        continue-on-error: true
        timeout-minutes: 40
      - run: python -m src.run dates
        if: ${{ !inputs.only || contains(format(' {0} ', inputs.only), ' dates ') }}
        continue-on-error: true
        timeout-minutes: 90
      - run: python -m src.run mbdates
        if: ${{ !inputs.only || contains(format(' {0} ', inputs.only), ' mbdates ') }}
        continue-on-error: true
        timeout-minutes: 75
      - run: python -m src.run dates-retry
        if: ${{ !inputs.only || contains(format(' {0} ', inputs.only), ' dates-retry ') }}
        continue-on-error: true
        timeout-minutes: 40
      - run: python -m src.run deezer
        if: ${{ !inputs.only || contains(format(' {0} ', inputs.only), ' deezer ') }}
        continue-on-error: true
        timeout-minutes: 15
      - run: python -m src.run labels
        if: ${{ !inputs.only || contains(format(' {0} ', inputs.only), ' labels ') }}
        continue-on-error: true
        timeout-minutes: 20
      - run: python -m src.run mblabels
        if: ${{ !inputs.only || contains(format(' {0} ', inputs.only), ' mblabels ') }}
        continue-on-error: true
        timeout-minutes: 20
      - run: python -m src.run youtube
        if: ${{ !inputs.only || contains(format(' {0} ', inputs.only), ' youtube ') }}
        continue-on-error: true
        timeout-minutes: 20
      - run: python -m src.run ytapi
        if: ${{ !inputs.only || contains(format(' {0} ', inputs.only), ' ytapi ') }}
        continue-on-error: true
        timeout-minutes: 10
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      - run: python -m src.run photos
        if: ${{ !inputs.only || contains(format(' {0} ', inputs.only), ' photos ') }}
        continue-on-error: true
        timeout-minutes: 15
      - run: python -m src.run pageviews
        if: ${{ !inputs.only || contains(format(' {0} ', inputs.only), ' pageviews ') }}
        continue-on-error: true
        timeout-minutes: 20
      - run: python -m src.run awards
        if: ${{ !inputs.only || contains(format(' {0} ', inputs.only), ' awards ') }}
        continue-on-error: true
        timeout-minutes: 20
      - run: python -m src.run financials
        if: ${{ !inputs.only || contains(format(' {0} ', inputs.only), ' financials ') }}
        continue-on-error: true
        timeout-minutes: 10
      - run: python -m src.run reports
        if: ${{ !inputs.only || contains(format(' {0} ', inputs.only), ' reports ') }}
        continue-on-error: true
        timeout-minutes: 20
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Commit
        if: always()
        run: |
          git config user.name "music-bot"
          git config user.email "music-bot@users.noreply.github.com"
          git add raw data registry review site/photos
          git diff --cached --quiet || git commit -m "Monthly refresh $(date -u +%F)"
          git pull --no-rebase --no-edit origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"
