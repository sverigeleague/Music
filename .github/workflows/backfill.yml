# One-off, by hand: weekly listener history since 2023 from the Internet Archive's copies of kworb's listeners page
# (web.archive.org is not reachable from the build container). About 150 snapshots at one request every 3 seconds:
# under 15 minutes. Then Wikipedia page views (saved as it goes; Wikimedia may throttle). Safe to run again: weeks
# and artists already stored are skipped.
name: backfill
on:
  workflow_dispatch:
    inputs:
      refetch:
        description: "re-read every archived week (after adding a genre)"
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: data
  cancel-in-progress: false
jobs:
  wayback:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m src.run ${{ inputs.refetch && 'backfill-refetch' || 'backfill' }}
      - run: python -m src.run pageviews
        continue-on-error: true
      - name: Commit
        run: |
          git config user.name "music-bot"
          git config user.email "music-bot@users.noreply.github.com"
          git add data/listener_history.csv data/wikipedia_pageviews.csv
          git diff --cached --quiet || git commit -m "Listener history from the Wayback Machine $(date -u +%F)"
          git push
