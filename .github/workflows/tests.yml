# Pull requests, and code changes on main; not on the data commits (saves Actions minutes on a private repository).
name: tests
on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ["data/**", "raw/**", "review/**", "registry/**", "site/photos/**"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      # the site's scripts parse (ES modules; node is on the runner). The site-data tests skip here: no build in this job
      - run: for f in site/app.js site/config.js; do node --input-type=module --check < "$f" || exit 1; done
